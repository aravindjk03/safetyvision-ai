# SafetyVision AI — Model Registry & Governance
# Tracks trained models, artifact versions, metrics, and training lineage

registry:
  active_model: "SafetyVision-YOLO26"
  active_version: "3.0.0"

models:
  - model_name: "SafetyVision-YOLO26"
    model_version: "3.0.0"
    status: "production_candidate"
    architecture: "YOLO11n"
    framework: "Ultralytics YOLO 8.4"
    weights_path: "models/safetyvision_yolo26n.pt"
    onnx_path: "models/safetyvision_yolo26n.onnx"
    training_date: "2026-10-08"
    dataset_version: "v3.0.0-real-79 (63 train / 16 held-out real workshop photos) + 150 synthetic"
    classes:
      - "grinder"
      - "guard"
      - "handle"
      - "cable"
      - "switch"
      - "damaged_guard"
      - "damaged_cable"
      - "person"
      - "drill"
    metrics:
      # Held-out REAL photos only (16 images, 42 instances), imgsz 640
      mAP50: 0.725
      mAP50_95: 0.349
      precision: 0.759
      mean_recall: 0.733
      tool_identification_accuracy: 1.000   # 16/16 photos: correct tool type (grinder vs drill)
      grinder_mAP50: 0.986
      drill_mAP50: 0.995
      guard_recall: 0.667
      handle_recall: 0.762
      cable_recall: 0.367
      switch_recall: 0.600
      previous_model_tool_identification: 0.0625   # v2.1.0 identified 1/16 of the same photos
    training_parameters:
      base_weights: "yolo11n.pt"
      epochs: 27   # best checkpoint of a 35-epoch run
      imgsz: 640
      batch_size: 16
      optimizer: "auto (AdamW)"
      device: "cpu"
      real_image_oversampling: 4
    notes: "Trained on 63 labelled real workshop photos (angle grinders and power drills) plus 150 synthetic images. Reliably identifies the tool type on real photos. Small parts (power cord, switch) are still often missed, which can produce a FAIL for a part that is present; more labelled real photos are the fix."

  - model_name: "SafetyVision-YOLO26"
    model_version: "2.1.0"
    status: "superseded"
    architecture: "YOLO11n"
    framework: "Ultralytics YOLO 8.4"
    weights_path: "models/safetyvision_yolo26n.pt"
    onnx_path: "models/safetyvision_yolo26n.onnx"
    training_date: "2026-10-07"
    dataset_version: "v2.0.0-synthetic-805-samples (600 train / 120 val / 85 test)"
    classes:
      - "grinder"
      - "guard"
      - "handle"
      - "cable"
      - "switch"
      - "damaged_guard"
      - "damaged_cable"
      - "person"
    metrics:
      # Held-out test split (85 images, 411 instances), imgsz 320
      mAP50: 0.995
      mAP50_95: 0.994
      precision: 0.997
      mean_recall: 1.000
      guard_recall: 1.000
      damaged_guard_recall: 1.000
      damaged_cable_recall: 1.000
      inference_latency_ms: 22.7  # CPU, 4 vCPU, imgsz 320, end-to-end predict()
    training_parameters:
      base_weights: "yolo11n.pt"
      epochs: 30
      imgsz: 320
      batch_size: 16
      optimizer: "auto (AdamW)"
      device: "cpu"
      training_time_hours: 0.24
    notes: "Retrained from yolo11n.pt on the synthetic OpenCV-rendered dataset. Metrics are saturated because train and test come from the same synthetic generator; they do NOT indicate accuracy on real photographs. Collect and label real images (docs/DATA_COLLECTION_GUIDE.md) before relying on this model."

  - model_name: "SafetyVision-YOLO26"
    model_version: "2.0.0"
    status: "superseded"
    architecture: "YOLO26n"
    framework: "Ultralytics YOLO (YOLO11n fused)"
    weights_path: "models/safetyvision_yolo26n.pt"
    onnx_path: "models/safetyvision_yolo26n.onnx"
    training_date: "2026-10-07"
    dataset_version: "v2.0.0-high-accuracy-805-samples"
    classes:
      - "grinder"
      - "guard"
      - "handle"
      - "cable"
      - "switch"
      - "damaged_guard"
      - "damaged_cable"
      - "person"
    metrics:
      mAP50: 0.995
      mAP50_95: 0.995
      precision: 0.998
      mean_recall: 1.000
      guard_recall: 1.000
      grinder_recall: 1.000
      handle_recall: 1.000
      cable_recall: 1.000
      switch_recall: 1.000
      damaged_guard_recall: 1.000
      damaged_cable_recall: 1.000
      person_recall: 1.000
      inference_latency_ms: 21.4
    training_parameters:
      epochs: 20
      imgsz: 320
      batch_size: 16
      optimizer: "AdamW"
      device: "cpu"
    notes: "High-accuracy trained model on 805 industrial images (3,913 ground-truth instances) with 99.8% precision, 100% recall, and 99.5% mAP50-95."

  - model_name: "SafetyVision-Demo-YOLO"
    model_version: "0.0.1"
    status: "demo"
    architecture: "YOLO11n-pretrained"
    framework: "Ultralytics YOLO"
    weights_path: "yolo11n.pt"
    training_date: "2026-10-05"
    dataset_version: "coco-pretrained"
    classes: ["coco80"]
    metrics:
      mAP50: 0.0
      notes: "Demo model for verifying pipeline and camera stream before custom model weights are loaded."
    training_parameters: {}
    notes: "DEMO MODEL — NOT TRAINED FOR INDUSTRIAL SAFETY INSPECTION"
